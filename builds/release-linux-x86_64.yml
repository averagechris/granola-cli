image: nixos/unstable
arch: x86_64
oauth: pages.sr.ht/PAGES:RW
environment:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/granola-cli
tasks:
  - build: |
      cd granola-cli
      nix build .#release-artifact --out-link result-release-artifact
      mkdir -p ~/artifacts
      cp -p result-release-artifact/* ~/artifacts/
      mkdir -p dist/downloads
      cp -p result-release-artifact/* dist/downloads/
  - publish: |
      cd granola-cli
      nix run .#build-pages -- --include-existing-downloads
      nix run .#publish-pages
artifacts:
  - artifacts/granola-cli-v0.8.1-x86_64-linux.tar.gz
  - artifacts/granola-cli-v0.8.1-x86_64-linux.tar.gz.sha256
