[package]
name = "granola-cli"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI for Granola meeting notes"
authors = ["Chris Wilson"]
license = "MIT"
repository = "https://git.sr.ht/~averagechris/granola-cli"
homepage = "https://git.sr.ht/~averagechris/granola-cli"
readme = "README.md"
keywords = ["granola", "cli", "notes", "meetings", "productivity"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "granola"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "2"
dirs = "5"
dialoguer = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "json", "rustls-tls-native-roots", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
url = "2"
open = "5.3.5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
wiremock = "0.6.5"
