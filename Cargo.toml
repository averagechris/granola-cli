[package]
name = "granola-cli"
version = "0.8.2"
edition = "2021"
description = "A Rust CLI for Granola meeting notes"
authors = ["Christopher Cummings"]
license = "MIT"
repository = "https://git.sr.ht/~averagechris/granola-cli"
homepage = "https://git.sr.ht/~averagechris/granola-cli"
readme = "README.md"
keywords = ["granola", "cli", "notes", "meetings", "productivity"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "granola"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
dirs = "6"
dialoguer = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "query", "rustls", "system-proxy"] }
regex = "1"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1"
unicode-width = "0.2"
url = "2"
open = "5.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = "4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "4"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = "4"

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
tempfile = "3"
wiremock = "0.6.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
panic = "abort"
